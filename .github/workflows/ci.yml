name: CI

on:
  push:
  pull_request:

# The jobs only read the code. Actions are pinned to commits, not tags, so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskel
          POSTGRES_PASSWORD: taskel
          POSTGRES_DB: taskel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASKEL_TEST_CONNECTION: Host=localhost;Port=5432;Database=taskel_test;Username=taskel;Password=taskel
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Known vulnerabilities in dependencies. Fails on any vulnerable NuGet package, and on npm advisories
  # rated high or critical.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: NuGet packages
        working-directory: backend
        run: |
          dotnet restore
          dotnet list Taskel.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - name: npm packages
        working-directory: frontend
        # Fails on high or critical advisories; temporary exceptions are listed in the script.
        run: node scripts/audit.mjs

  # The offline/ folder must hold every package the solution needs, so it can be built without the
  # internet. Restores only from it, into empty caches, for Linux and for Windows.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: .NET packages from offline/nuget only
        working-directory: backend
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-empty
        run: |
          dotnet restore Taskel.slnx --configfile ../offline/NuGet.Config
          dotnet tool restore --configfile ../offline/NuGet.Config
          dotnet build Taskel.slnx --no-restore
      - name: npm packages from offline/npm only, for Linux and Windows
        working-directory: frontend
        run: |
          for os in linux win32; do
            rm -rf node_modules
            npm ci --offline --cache ../offline/npm --os=$os --cpu=x64 --ignore-scripts --no-audit --no-fund
          done
