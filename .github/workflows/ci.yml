name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskel
          POSTGRES_PASSWORD: taskel
          POSTGRES_DB: taskel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASKEL_TEST_CONNECTION: Host=localhost;Port=5432;Database=taskel_test;Username=taskel;Password=taskel
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
