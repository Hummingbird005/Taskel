# Local PostgreSQL for development: `docker compose up -d`
# With a Keycloak to try single sign-on: `docker compose --profile keycloak up -d` (see docs/KEYCLOAK.md)
services:
  postgres:
    image: postgres:17
    container_name: taskel-postgres
    environment:
      POSTGRES_USER: taskel
      POSTGRES_PASSWORD: taskel
      POSTGRES_DB: taskel
    ports:
      - "5432:5432"
    volumes:
      - taskel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskel -d taskel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development only: plain HTTP, an admin/admin console, and a realm whose passwords are public.
  keycloak:
    image: keycloak/keycloak:26.4
    container_name: taskel-keycloak
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/taskel-realm.json:/opt/keycloak/data/import/taskel-realm.json:ro

volumes:
  taskel-pgdata:
