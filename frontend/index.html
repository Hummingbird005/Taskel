<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskel</title>
    <script>
      // The saved theme is applied before the first paint, so the page does not flash in another one.
      try {
        var theme = localStorage.getItem('taskel.theme')
        if (['light', 'dark', 'frost', 'amber'].indexOf(theme) >= 0) document.documentElement.dataset.theme = theme
        if (theme === 'frost' || theme === 'amber') document.documentElement.dataset.glass = ''
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
